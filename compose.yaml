name: kanshan-element-harbor

services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: 8787
      DATABASE_PATH: /app/data/game.db
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      HACKATHON_DEMO: ${HACKATHON_DEMO:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-hackathon-demo-admin}
      ZHIHU_REQUIRE_OAUTH_STATE: ${ZHIHU_REQUIRE_OAUTH_STATE:-true}
      ZHIHU_OAUTH_APP_ID: ${ZHIHU_OAUTH_APP_ID:-}
      ZHIHU_OAUTH_APP_KEY: ${ZHIHU_OAUTH_APP_KEY:-}
      ZHIHU_OAUTH_REDIRECT_URI: ${ZHIHU_OAUTH_REDIRECT_URI:-}
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    volumes:
      - ./data:/app/data
    ports:
      - "${APP_PORT:-8787}:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    stop_grace_period: 15s
